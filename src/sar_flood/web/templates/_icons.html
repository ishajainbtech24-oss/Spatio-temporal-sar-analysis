{# Inline stroke icons (24px grid). Usage: {% from "_icons.html" import icon %}{{ icon("drop") }} #}
{% macro icon(name, cls="ico") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "drop" %}<path d="M12 3.5c3.6 4.3 6 7.6 6 10.5a6 6 0 0 1-12 0c0-2.9 2.4-6.2 6-10.5z"/><path d="M9 15a3 3 0 0 0 3 3"/>
{%- elif name == "land" %}<path d="M3 18l5-7 4 5 3-4 6 6z"/><circle cx="16.5" cy="6.5" r="1.8"/>
{%- elif name == "grid" %}<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/>
{%- elif name == "pixels" %}<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1" fill="currentColor" fill-opacity=".35"/>
{%- elif name == "chip" %}<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 9.5h5v5h-5zM9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
{%- elif name == "back" %}<path d="M15 5l-7 7 7 7"/>
{%- elif name == "download" %}<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == "pin" %}<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>
{%- elif name == "expand" %}<path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5"/>
{%- elif name == "info" %}<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/>
{%- elif name == "alert" %}<path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.4v.1"/>
{%- elif name == "check" %}<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.4 2.4 4.8-5"/>
{%- elif name == "x" %}<circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/>
{%- elif name == "satellite" %}<path d="M7.5 9.5l4-4 7 7-4 4z"/><path d="M5 12l2.5-2.5M12 19l2.5-2.5M4 4l3.5 3.5"/><path d="M4.5 16.5a3 3 0 0 0 3 3"/>
{%- elif name == "leaf" %}<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19l7-7"/>
{%- elif name == "layers" %}<path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/>
{%- endif -%}
</svg>
{%- endmacro %}
